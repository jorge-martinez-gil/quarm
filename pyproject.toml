[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quarm"
version = "0.2.0"
description = "Counterfactual risk surfaces for interaction-aware data-quality measurement"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jorge Martinez-Gil", email = "jorge.martinez-gil@scch.at"}]
keywords = ["data quality", "data-centric AI", "Shapley value", "robustness", "auditing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "duckdb>=1.3,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
paper = ["matplotlib>=3.9,<4", "reportlab>=4.2,<6", "pypdf>=5,<7", "pdfplumber>=0.11,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
quarm = "quarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quarm"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
